[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diffmjstep"
version = "0.2.0"
description = "Minimal PyTorch autograd helpers for differentiable MuJoCo stepping."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Elad Sharony" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mujoco", "pytorch", "differentiable-simulation", "optimal-control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mujoco>=3.5.0",
    "ninja>=1.11",
    "numpy>=1.24",
    "torch>=2.4",
]

[project.urls]
Repository = "https://github.com/EladSharony/DiffMjStep"
Issues = "https://github.com/EladSharony/DiffMjStep/issues"

[tool.setuptools.packages.find]
include = ["diffmjstep*"]

[tool.setuptools.package-data]
diffmjstep = ["cpp/*.cpp"]
